<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title">실험 하네스 방법론 흐름도</title>
  <desc id="desc">baseline 픽스처에서 OFF worktree와 ON worktree로 분기해 각각 격리 세션을 실행하고, ON 경로는 훅이 서브에이전트까지 실제로 전달되는지 활성화 검증을 거쳐 명시적 호출로 우회한 뒤 OFF 결과와 비교해 근거 기반으로 판단하는 흐름</desc>

  <rect x="0" y="0" width="900" height="360" fill="#fdf6ec" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
  </defs>

  <!-- Row labels -->
  <text x="20" y="16" font-size="13" font-weight="700" fill="#8a7f72">OFF 경로</text>
  <text x="20" y="176" font-size="13" font-weight="700" fill="#8a7f72">ON 경로</text>

  <!-- Row 1: OFF -->
  <!-- baseline pill -->
  <rect x="20" y="30" width="190" height="80" rx="40" fill="#fffaf4" stroke="#c9bfae" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="115" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#57534e">baseline 픽스처(불변)</text>

  <!-- OFF worktree -->
  <rect x="240" y="30" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="335" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">OFF: 스킬 비활성화</text>
  <text x="335" y="89" text-anchor="middle" font-size="12.5" font-weight="500" fill="#8a7f72">격리 worktree 실행</text>

  <!-- 비교 판단 (destination — solid emerald) -->
  <rect x="680" y="30" width="190" height="80" rx="14" fill="#10b981" stroke="#059669" stroke-width="1.5" />
  <text x="775" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">OFF vs ON 비교</text>
  <text x="775" y="89" text-anchor="middle" font-size="13.5" font-weight="500" fill="#ecfdf5">근거 기반 판단</text>

  <!-- Row 1 arrows: baseline -> OFF -> (skip col3) -> 비교 -->
  <line x1="210" y1="70" x2="238" y2="70" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="70" x2="678" y2="70" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Row 1 skip caption -->
  <line x1="555" y1="70" x2="555" y2="98" stroke="#cbb8a3" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="555" y="116" text-anchor="middle" font-size="12.5" font-weight="500" fill="#a89f72">검증 단계 없이 곧장 비교로</text>

  <!-- Elbow connector: baseline (row1 col1) -> ON (row2 col2) -->
  <path d="M 115 110 L 115 150 L 335 150 L 335 188" fill="none" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Row 2: ON -->
  <!-- ON worktree (pale coral — leads into the highlighted steps) -->
  <rect x="240" y="190" width="190" height="80" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <text x="335" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#c13a26">ON: 스킬 활성화</text>
  <text x="335" y="249" text-anchor="middle" font-size="12.5" font-weight="500" fill="#8a7f72">격리 worktree 실행</text>

  <!-- 활성화 검증 (amber — caution step) -->
  <rect x="460" y="190" width="190" height="80" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
  <text x="555" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">⚠ 활성화 검증</text>
  <text x="555" y="249" text-anchor="middle" font-size="12" font-weight="500" fill="#8a7f72">룰셋 도달 여부 확인</text>

  <!-- 우회 (hero node — solid coral, the shared fix across all three experiments) -->
  <rect x="680" y="190" width="190" height="80" rx="14" fill="#e34a33" stroke="#c13a26" stroke-width="1.5" />
  <text x="775" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#fff8f5">우회: 명시적 호출</text>
  <text x="775" y="249" text-anchor="middle" font-size="12.5" font-weight="500" fill="#ffd9cf">직접 지정 · 헤드리스 CLI</text>

  <!-- Row 2 arrows -->
  <line x1="430" y1="230" x2="458" y2="230" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="650" y1="230" x2="678" y2="230" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 우회 -> 비교 판단 (row2 col4 up into row1 col4, merging with the OFF path) -->
  <line x1="775" y1="188" x2="775" y2="112" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Caption for the shared discovery -->
  <line x1="555" y1="270" x2="555" y2="292" stroke="#ffab91" stroke-width="1.5" />
  <text x="365" y="310" text-anchor="start" font-size="13" font-weight="500" fill="#c13a26">세 실험 모두에서 발견 — 설정만 켜서는 룰셋이 주입되지 않는다</text>

  <text x="450" y="345" text-anchor="middle" font-size="12" fill="#a89f92">skill-experiment-lab — baseline 픽스처 → OFF/ON 격리 worktree → 활성화 검증 → 지표 비교 방법론 재구성</text>
</svg>
