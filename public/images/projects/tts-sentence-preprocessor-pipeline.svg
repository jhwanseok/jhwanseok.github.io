<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title">영어와 한국어 phonemization 파이프라인 비교</title>
  <desc id="desc">영어는 정규화 후 바로 IPA로 변환되는 2단계 파이프라인이고, 한국어는 정규화와 IPA 변환 사이에 경음화·비음화·유음화·구개음화 등 발음 규칙을 적용하는 G2P 단계가 추가된 3단계 파이프라인이다</desc>

  <rect x="0" y="0" width="900" height="320" fill="#fdf6ec" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
  </defs>

  <!-- Row labels -->
  <text x="20" y="16" font-size="13" font-weight="700" fill="#8a7f72">영어 파이프라인</text>
  <text x="20" y="150" font-size="13" font-weight="700" fill="#8a7f72">한국어 파이프라인</text>

  <!-- Row 1: English -->
  <!-- 텍스트 입력 -->
  <rect x="20" y="26" width="190" height="80" rx="40" fill="#fffaf4" stroke="#c9bfae" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="115" y="72" text-anchor="middle" font-size="16" font-weight="500" fill="#57534e">텍스트 입력</text>

  <!-- 정규화 -->
  <rect x="240" y="26" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="335" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">정규화</text>
  <text x="335" y="85" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">숫자·약어·기호 → 발화 형태</text>

  <!-- IPA 변환 (English, destination — emerald) -->
  <rect x="680" y="26" width="190" height="80" rx="14" fill="#10b981" stroke="#059669" stroke-width="1.5" />
  <text x="775" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">IPA 변환</text>
  <text x="775" y="85" text-anchor="middle" font-size="13.5" font-weight="500" fill="#ecfdf5">espeak-ng 백엔드</text>

  <!-- Row 1 arrows: 텍스트입력 -> 정규화 -> (skip) -> IPA 변환 -->
  <line x1="210" y1="66" x2="238" y2="66" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="66" x2="678" y2="66" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Row 1 skip caption -->
  <line x1="555" y1="66" x2="555" y2="98" stroke="#cbb8a3" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="555" y="116" text-anchor="middle" font-size="12.5" font-weight="500" fill="#a89f72">G2P 없이 정규화 → IPA 직행</text>

  <!-- Row 2: Korean -->
  <!-- 텍스트 입력 -->
  <rect x="20" y="160" width="190" height="80" rx="40" fill="#fffaf4" stroke="#c9bfae" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="115" y="206" text-anchor="middle" font-size="16" font-weight="500" fill="#57534e">텍스트 입력</text>

  <!-- 정규화 -->
  <rect x="240" y="160" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="335" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">정규화</text>
  <text x="335" y="219" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">숫자·약어·기호 → 발화 형태</text>

  <!-- G2P (hero node — solid coral, the key differentiator) -->
  <rect x="460" y="160" width="190" height="80" rx="14" fill="#e34a33" stroke="#c13a26" stroke-width="1.5" />
  <text x="555" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#fff8f5">G2P</text>
  <text x="555" y="219" text-anchor="middle" font-size="13" font-weight="500" fill="#ffd9cf">경음화·비음화·유음화·구개음화</text>

  <!-- IPA 변환 (Korean, destination — emerald) -->
  <rect x="680" y="160" width="190" height="80" rx="14" fill="#10b981" stroke="#059669" stroke-width="1.5" />
  <text x="775" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">IPA 변환</text>
  <text x="775" y="219" text-anchor="middle" font-size="13.5" font-weight="500" fill="#ecfdf5">자모 → IPA 테이블</text>

  <!-- Row 2 arrows -->
  <line x1="210" y1="200" x2="238" y2="200" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="200" x2="458" y2="200" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="650" y1="200" x2="678" y2="200" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Caption for G2P step -->
  <line x1="555" y1="240" x2="555" y2="262" stroke="#ffab91" stroke-width="1.5" />
  <text x="460" y="280" text-anchor="start" font-size="13.5" font-weight="500" fill="#c13a26">학교 → 학꾜 → hak̚k͈jo (경음화가 반영된 IPA)</text>

  <text x="450" y="308" text-anchor="middle" font-size="12" fill="#a89f92">tts-sentence-preprocessor — 영어(2단계)·한국어(3단계) phonemization 파이프라인 비교</text>
</svg>
