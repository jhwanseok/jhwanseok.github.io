<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title2 desc2" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title2">AR과 NAR의 예측 방식 비교</title>
  <desc id="desc2">AR은 코드북 0의 토큰을 이전 토큰에 조건화해 한 번에 하나씩 순차적으로 예측하고, NAR은 음소·프롬프트·코드북 0을 조건으로 코드북 1부터 7까지를 한 번에 동시에 예측한다</desc>

  <rect x="0" y="0" width="900" height="340" fill="#fdf6ec" />

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
    <marker id="arrow2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9bfae" />
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#292524">같은 "코드북 예측"인데 방식이 다르다</text>
  <text x="450" y="54" text-anchor="middle" font-size="12.5" font-weight="500" fill="#8a7f72">AR은 순서대로 하나씩, NAR은 조건 하나로 한꺼번에</text>

  <!-- AR panel -->
  <rect x="40" y="80" width="380" height="180" rx="16" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <text x="230" y="112" text-anchor="middle" font-size="15.5" font-weight="700" fill="#c13a26">AR: 코드북 0</text>

  <!-- sequential tokens t1..t4 -->
  <circle cx="100" cy="170" r="20" fill="#fffaf4" stroke="#c13a26" stroke-width="1.5" />
  <text x="100" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#c13a26">t1</text>
  <line x1="122" y1="170" x2="158" y2="170" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow2)" />

  <circle cx="180" cy="170" r="20" fill="#fffaf4" stroke="#c13a26" stroke-width="1.5" />
  <text x="180" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#c13a26">t2</text>
  <line x1="202" y1="170" x2="238" y2="170" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow2)" />

  <circle cx="260" cy="170" r="20" fill="#fffaf4" stroke="#c13a26" stroke-width="1.5" />
  <text x="260" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#c13a26">t3</text>
  <line x1="282" y1="170" x2="318" y2="170" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow2)" />

  <circle cx="340" cy="170" r="20" fill="#fffaf4" stroke="#c13a26" stroke-width="1.5" />
  <text x="340" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#c13a26">t4</text>

  <text x="230" y="222" text-anchor="middle" font-size="12" font-weight="500" fill="#8a7f72">이전 토큰을 보고 다음 토큰을</text>
  <text x="230" y="240" text-anchor="middle" font-size="12" font-weight="500" fill="#8a7f72">한 번에 하나씩, 스텝 수만큼 반복</text>

  <!-- divider -->
  <line x1="450" y1="80" x2="450" y2="260" stroke="#c9bfae" stroke-width="1.5" stroke-dasharray="5 5" />

  <!-- NAR panel -->
  <rect x="480" y="80" width="380" height="180" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="670" y="112" text-anchor="middle" font-size="15.5" font-weight="700" fill="#292524">NAR: 코드북 1~7</text>

  <circle cx="670" cy="150" r="16" fill="#ffe4de" stroke="#c13a26" stroke-width="1.5" />
  <text x="670" y="154" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c13a26">조건</text>

  <!-- fan-out arrows to 7 codebooks -->
  <line x1="670" y1="166" x2="520" y2="196" stroke="#c9bfae" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow2c)" />
  <line x1="670" y1="166" x2="570" y2="196" stroke="#c9bfae" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow2c)" />
  <line x1="670" y1="166" x2="620" y2="196" stroke="#c9bfae" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow2c)" />
  <line x1="670" y1="166" x2="670" y2="196" stroke="#c9bfae" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow2c)" />
  <line x1="670" y1="166" x2="720" y2="196" stroke="#c9bfae" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow2c)" />
  <line x1="670" y1="166" x2="770" y2="196" stroke="#c9bfae" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow2c)" />
  <line x1="670" y1="166" x2="820" y2="196" stroke="#c9bfae" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow2c)" />

  <g font-size="10.5" font-weight="700" fill="#292524">
    <rect x="507" y="196" width="26" height="26" rx="6" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.3" />
    <text x="520" y="213" text-anchor="middle">1</text>
    <rect x="557" y="196" width="26" height="26" rx="6" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.3" />
    <text x="570" y="213" text-anchor="middle">2</text>
    <rect x="607" y="196" width="26" height="26" rx="6" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.3" />
    <text x="620" y="213" text-anchor="middle">3</text>
    <rect x="657" y="196" width="26" height="26" rx="6" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.3" />
    <text x="670" y="213" text-anchor="middle">4</text>
    <rect x="707" y="196" width="26" height="26" rx="6" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.3" />
    <text x="720" y="213" text-anchor="middle">5</text>
    <rect x="757" y="196" width="26" height="26" rx="6" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.3" />
    <text x="770" y="213" text-anchor="middle">6</text>
    <rect x="807" y="196" width="26" height="26" rx="6" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.3" />
    <text x="820" y="213" text-anchor="middle">7</text>
  </g>

  <text x="670" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#8a7f72">조건 하나로 나머지 전부를</text>
  <text x="670" y="256" text-anchor="middle" font-size="12" font-weight="500" fill="#8a7f72">한 스텝에 동시 예측</text>

  <text x="450" y="298" text-anchor="middle" font-size="13.5" font-weight="500" fill="#c13a26">NAR의 "조건"에는 AR이 정한 코드북 0이 그대로 들어간다.</text>
  <text x="450" y="320" text-anchor="middle" font-size="12" fill="#a89f92">VALL-E (Wang et al., 2023) 구조 단순화</text>
</svg>
