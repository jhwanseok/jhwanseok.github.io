<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="bpfvTitle bpfvDesc">
  <title id="bpfvTitle">모든 것을 묶고 한 칸만 풀어 둔다: Noise 대회의 설계</title>
  <desc id="bpfvDesc">모델(3,770만 파라미터 GPT, 8블록, 폭 512), 데이터(FineWeb 고정 학습셋, 1에폭), 점수(검증셋 111만 예측의 평균 cross-entropy), 하드웨어(H100 8장 노드 한 대, 시드 0)는 모두 고정되어 있습니다. 가운데의 학습 알고리즘만 자유롭게 바꿀 수 있고, 단 backward는 쓸 수 없습니다.</desc>

  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
    .title-text { font-weight: 700; font-size: 22px; fill: #292524; }
    .subtitle-text { font-size: 14px; fill: #8a7f72; }
    .box-title { font-weight: 700; font-size: 15px; }
    .box-sub { font-size: 12px; fill: #8a7f72; }
    .lock { font-size: 12px; font-weight: 700; fill: #8a7f72; }
    .caption-text { font-size: 15px; fill: #292524; }
  </style>

  <rect width="880" height="420" fill="#fdf6ec" />

  <text x="440" y="34" text-anchor="middle" class="title-text">모든 것을 묶고 한 칸만 풀어 둔다</text>
  <text x="440" y="56" text-anchor="middle" class="subtitle-text">참가자가 바꿀 수 있는 것은 학습 알고리즘뿐이다</text>

  <!-- connectors (drawn first, under boxes) -->
  <line x1="290" y1="135" x2="440" y2="220" stroke="#b3a08c" stroke-width="2" />
  <line x1="590" y1="135" x2="440" y2="220" stroke="#b3a08c" stroke-width="2" />
  <line x1="290" y1="305" x2="440" y2="220" stroke="#b3a08c" stroke-width="2" />
  <line x1="590" y1="305" x2="440" y2="220" stroke="#b3a08c" stroke-width="2" />

  <!-- fixed boxes -->
  <rect x="60" y="96" width="230" height="78" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="76" y="118" class="lock">고정</text>
  <text x="175" y="132" text-anchor="middle" class="box-title" fill="#292524">모델</text>
  <text x="175" y="154" text-anchor="middle" class="box-sub">3,770만 파라미터 GPT, 8블록 × 폭 512</text>

  <rect x="590" y="96" width="230" height="78" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="606" y="118" class="lock">고정</text>
  <text x="705" y="132" text-anchor="middle" class="box-title" fill="#292524">데이터</text>
  <text x="705" y="154" text-anchor="middle" class="box-sub">FineWeb 고정 학습셋, 딱 1에폭</text>

  <rect x="60" y="266" width="230" height="78" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="76" y="288" class="lock">고정</text>
  <text x="175" y="302" text-anchor="middle" class="box-title" fill="#292524">점수</text>
  <text x="175" y="324" text-anchor="middle" class="box-sub">검증 111만 예측의 cross-entropy</text>

  <rect x="590" y="266" width="230" height="78" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="606" y="288" class="lock">고정</text>
  <text x="705" y="302" text-anchor="middle" class="box-title" fill="#292524">하드웨어</text>
  <text x="705" y="324" text-anchor="middle" class="box-sub">H100 8장 노드 1대, 시드 0</text>

  <!-- hero: the one free slot -->
  <rect x="325" y="178" width="230" height="84" rx="14" fill="#e34a33" stroke="#c13a26" stroke-width="2" />
  <text x="440" y="212" text-anchor="middle" class="box-title" fill="#ffffff">학습 알고리즘</text>
  <text x="440" y="236" text-anchor="middle" font-size="13" fill="#ffffff">자유, 단 backward 금지</text>

  <text x="440" y="396" text-anchor="middle" class="caption-text">나머지를 모두 묶어 두었기에, 기록의 차이는 곧 학습 알고리즘의 차이가 됩니다.</text>
</svg>
