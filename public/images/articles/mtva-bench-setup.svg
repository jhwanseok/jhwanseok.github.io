<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title">MTVA-Bench의 평가 구조</title>
  <desc id="desc">시뮬레이션된 발신자의 말이 채널 층에서 ASR 오류와 VAD 분할을 입히는 텍스트로 바뀌어 평가 대상 언어모델에 전달되고, 모델은 모의 백엔드와 도구 호출을 주고받는다. 통화 전체는 하나의 기록으로 저장되며, 코드 검사기, 시나리오 판정 LLM, 대화 판정 LLM이 각자 다른 범위만 보고 채점한 뒤 과제 50퍼센트와 대화 50퍼센트로 합산한다.</desc>

  <rect x="0" y="0" width="1000" height="560" fill="#fdf6ec" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
  </defs>

  <!-- Row 1: simulated surroundings and the model under test -->
  <rect x="30" y="50" width="190" height="90" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="125" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">발신자 시뮬레이터</text>
  <text x="125" y="112" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">비공개 브리프로 연기</text>

  <rect x="280" y="50" width="190" height="90" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <text x="375" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#c13a26">채널 층</text>
  <text x="375" y="112" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">단어 누락·중복, 문장 분할</text>

  <rect x="530" y="50" width="190" height="90" rx="14" fill="#e34a33" stroke="#c13a26" stroke-width="1.5" />
  <text x="625" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">평가 대상 언어모델</text>
  <text x="625" y="112" text-anchor="middle" font-size="13.5" font-weight="500" fill="#ffffff">지시문·도구 스키마·텍스트</text>

  <rect x="780" y="50" width="190" height="90" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="875" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">모의 백엔드</text>
  <text x="875" y="112" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">보낸 인자대로 응답</text>

  <line x1="220" y1="95" x2="278" y2="95" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="470" y1="95" x2="528" y2="95" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="722" y1="95" x2="778" y2="95" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />

  <text x="500" y="28" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">ASR와 TTS 사이의 언어모델만 실물로 두고, 나머지는 모두 시뮬레이션한다</text>

  <!-- Trace -->
  <path d="M 625 140 L 625 205" fill="none" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="30" y="205" width="940" height="76" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="500" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">저장된 통화 기록</text>
  <text x="500" y="262" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">메시지, 도구 호출, 반환값, 채널이 입힌 변형에 모두 번호가 붙고, 채점은 이 기록만 근거로 한다</text>

  <!-- Graders -->
  <line x1="185" y1="281" x2="185" y2="338" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="500" y1="281" x2="500" y2="338" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="815" y1="281" x2="815" y2="338" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="30" y="340" width="310" height="96" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="185" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">행동 검사기 (코드)</text>
  <text x="185" y="398" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">도구, 인자, 횟수, 순서를 판정</text>
  <text x="185" y="418" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">모델이 개입하지 않는다</text>

  <rect x="345" y="340" width="310" height="96" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
  <text x="500" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">시나리오 판정 (LLM)</text>
  <text x="500" y="398" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">동의, 본인 확인, 고지, 근거 있는 발언</text>
  <text x="500" y="418" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">인덱스 인용이 필수</text>

  <rect x="660" y="340" width="310" height="96" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
  <text x="815" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">대화 판정 (LLM)</text>
  <text x="815" y="398" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">과제를 모른 채 통화 품질만 평가</text>
  <text x="815" y="418" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">말하기 좋은 문장인지 확인</text>

  <!-- Result -->
  <line x1="185" y1="436" x2="185" y2="478" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="500" y1="436" x2="500" y2="478" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="815" y1="436" x2="815" y2="478" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="30" y="480" width="940" height="56" rx="14" fill="#10b981" stroke="#059669" stroke-width="1.5" />
  <text x="500" y="514" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">종합 점수 = 과제 50% + 대화 50%</text>
</svg>
