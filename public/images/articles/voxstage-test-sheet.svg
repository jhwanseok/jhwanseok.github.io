<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title">시험지, 가려 둔 문장, 채점기의 관계</title>
  <desc id="desc">시험지는 도메인 3개(은행, 쇼핑몰, 통신)와 언어 2개(영어, 한국어)와 기능 15종으로 이루어진다. 규칙을 쓰는 쪽은 대표 질문, 답, 기능 설명만 본다. 의역과 인식 오류 변형은 가려 둔다. 채점기는 시험 결과를 흐름, 슬롯 값, 도구 호출, 필수 문구 같은 끝 상태로 채점한다.</desc>

  <rect x="0" y="0" width="1000" height="480" fill="#fdf6ec" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
  </defs>

  <rect x="30" y="50" width="280" height="300" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="170" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">시험지</text>
  <text x="170" y="108" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">전부 직접 만든 합성 데이터</text>
  <text x="170" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#292524">도메인 3개</text>
  <text x="170" y="172" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">은행, 쇼핑몰, 통신</text>
  <text x="170" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#292524">언어 2개</text>
  <text x="170" y="236" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">영어, 한국어(번역이 아닌 쌍둥이)</text>
  <text x="170" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#292524">기능 15종</text>
  <text x="170" y="300" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">FAQ부터 정책 변경, 역할 연결까지</text>

  <rect x="370" y="50" width="260" height="140" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" />
  <text x="500" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">규칙을 쓰는 쪽이 보는 것</text>
  <text x="500" y="114" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">대표 질문</text>
  <text x="500" y="136" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">답</text>
  <text x="500" y="158" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">기능 설명</text>

  <rect x="370" y="210" width="260" height="140" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
  <text x="500" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">미리 가려 둔 문장</text>
  <text x="500" y="274" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">같은 뜻의 다른 표현(의역)</text>
  <text x="500" y="296" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">손으로 쓴 인식 오류 변형</text>
  <text x="500" y="324" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">채점할 때만 꺼내 씀</text>

  <rect x="690" y="50" width="280" height="300" rx="14" fill="#e34a33" stroke="#c13a26" stroke-width="1.5" />
  <text x="830" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">채점기: 끝 상태로 채점</text>
  <text x="830" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">어떤 흐름에 들어갔나</text>
  <text x="830" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">슬롯에 어떤 값이 찼나</text>
  <text x="830" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">어떤 도구를 불렀나</text>
  <text x="830" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">꼭 말해야 할 문구가 있나</text>
  <text x="830" y="290" text-anchor="middle" font-size="13.5" font-weight="500" fill="#ffffff">0점 답안과 만점 답안으로 먼저 시험</text>

  <line x1="310" y1="120" x2="368" y2="120" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="310" y1="280" x2="368" y2="280" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="630" y1="120" x2="688" y2="160" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="630" y1="280" x2="688" y2="240" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="30" y="384" width="940" height="62" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <text x="500" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#c13a26">같은 시험지로 모든 단계를 재야 점수를 나란히 놓을 수 있습니다</text>
  <text x="500" y="432" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">가려 둔 문장을 규칙 쓰는 쪽이 보면 점수는 규칙이 문장을 외운 정도가 됩니다</text>
</svg>
