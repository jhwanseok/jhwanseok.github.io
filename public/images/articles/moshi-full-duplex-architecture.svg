<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="moshiStreamTitle">
  <title id="moshiStreamTitle">Half-duplex와 Full-duplex 비교: 위 패널은 사용자와 Moshi가 순서를 기다리며 번갈아 문장을 타이핑하듯 흘려보내고, 아래 패널은 사용자가 먼저 말을 시작한 뒤 Moshi가 그 말이 끝나기 전에 겹쳐서 반응을 타이핑하기 시작한다</title>

  <defs>
    <g id="icon-person">
      <circle cx="0" cy="-9" r="7" fill="#57534e" />
      <path d="M -13 14 C -13 -1 13 -1 13 14 Z" fill="#57534e" />
    </g>
    <g id="icon-ai">
      <line x1="0" y1="-18" x2="0" y2="-12" stroke="#c13a26" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="-19" r="2" fill="#c13a26" />
      <rect x="-13" y="-12" width="26" height="20" rx="6" fill="#c13a26" />
      <circle cx="-5" cy="-2" r="2" fill="#fdf6ec" />
      <circle cx="5" cy="-2" r="2" fill="#fdf6ec" />
    </g>

    <clipPath id="clipUserHalf"><rect class="clip-user-half" x="220" y="130" width="0" height="28" /></clipPath>
    <clipPath id="clipMoshiHalf"><rect class="clip-moshi-half" x="565" y="180" width="0" height="28" /></clipPath>
    <clipPath id="clipUserFull"><rect class="clip-user-full" x="220" y="336" width="0" height="28" /></clipPath>
    <clipPath id="clipMoshiFull"><rect class="clip-moshi-full" x="545" y="386" width="0" height="28" /></clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
    .title-text { font-weight: 700; font-size: 20px; fill: #292524; }
    .subtitle-text { font-size: 13px; fill: #8a7f72; }
    .panel-label { font-weight: 700; font-size: 13px; }
    .box-title { font-weight: 700; font-size: 15px; }
    .wait-label { font-size: 13px; font-style: italic; fill: #8a7f72; }
    .caption-text { font-size: 14px; fill: #292524; }
    .stream-text { font-size: 15px; font-weight: 600; }

    .clip-user-half { animation: clipUserHalf 8s linear infinite; }
    .clip-moshi-half { animation: clipMoshiHalf 8s linear infinite; }
    .g-user-half { animation: gUserHalfOpacity 8s linear infinite; }
    .g-moshi-half { animation: gMoshiHalfOpacity 8s linear infinite; }
    .wait-label { animation: waitLabelFade 8s linear infinite; opacity: 0; }
    .clip-user-full { animation: clipUserFull 8s linear infinite; }
    .clip-moshi-full { animation: clipMoshiFull 8s linear infinite; }
    .g-user-full { animation: gUserFullOpacity 8s linear infinite; }
    .g-moshi-full { animation: gMoshiFullOpacity 8s linear infinite; }

    @keyframes clipUserHalf {
      0%   { width: 0; }
      18%  { width: 110px; }
      100% { width: 110px; }
    }
    @keyframes clipMoshiHalf {
      0%   { width: 0; }
      50%  { width: 0; }
      68%  { width: 95px; }
      100% { width: 95px; }
    }
    @keyframes gUserHalfOpacity {
      0%     { opacity: 1; }
      30%    { opacity: 1; }
      30.1%  { opacity: 0; }
      99.9%  { opacity: 0; }
      100%   { opacity: 1; }
    }
    @keyframes gMoshiHalfOpacity {
      0%     { opacity: 0; }
      49.9%  { opacity: 0; }
      50%    { opacity: 1; }
      80%    { opacity: 1; }
      80.1%  { opacity: 0; }
      100%   { opacity: 0; }
    }
    @keyframes waitLabelFade {
      0%     { opacity: 0; }
      30.1%  { opacity: 0; }
      35%    { opacity: 1; }
      48%    { opacity: 1; }
      50%    { opacity: 0; }
      80.1%  { opacity: 0; }
      85%    { opacity: 1; }
      98%    { opacity: 1; }
      100%   { opacity: 0; }
    }
    @keyframes clipUserFull {
      0%   { width: 0; }
      18%  { width: 80px; }
      100% { width: 80px; }
    }
    @keyframes clipMoshiFull {
      0%   { width: 0; }
      30%  { width: 0; }
      48%  { width: 115px; }
      100% { width: 115px; }
    }
    @keyframes gUserFullOpacity {
      0%     { opacity: 1; }
      75%    { opacity: 1; }
      75.1%  { opacity: 0; }
      99.9%  { opacity: 0; }
      100%   { opacity: 1; }
    }
    @keyframes gMoshiFullOpacity {
      0%     { opacity: 0; }
      29.9%  { opacity: 0; }
      30%    { opacity: 1; }
      90%    { opacity: 1; }
      90.1%  { opacity: 0; }
      100%   { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .clip-user-half, .clip-moshi-half { animation: none; }
      .clip-user-half { width: 110px; }
      .clip-moshi-half { width: 95px; }
      .g-user-half, .g-moshi-half { animation: none; opacity: 1; }
      .wait-label { animation: none; opacity: 0; }
      .clip-user-full { animation: none; width: 80px; }
      .clip-moshi-full { animation: none; width: 115px; }
      .g-user-full, .g-moshi-full { animation: none; opacity: 1; }
    }
  </style>

  <rect width="880" height="520" fill="#fdf6ec" />

  <text x="440" y="28" text-anchor="middle" class="title-text">Half-duplex와 Full-duplex: 두 사람의 말이 흐르는 방식</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle-text">가운데 막대는 시간축 위에서 각자 말하는 구간을 나타낸다</text>

  <!-- Panel A: Half-duplex -->
  <rect x="300" y="64" width="280" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d" />
  <text x="440" y="82" text-anchor="middle" class="panel-label" fill="#92400e">Half-duplex: 순서를 기다린다</text>

  <rect x="40" y="110" width="170" height="120" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <use href="#icon-person" transform="translate(125,152)" />
  <text x="125" y="205" text-anchor="middle" class="box-title" fill="#292524">사용자</text>

  <rect x="670" y="110" width="170" height="120" rx="16" fill="#ffe4de" stroke="#ffab91" stroke-width="2" />
  <use href="#icon-ai" transform="translate(755,152)" />
  <text x="755" y="205" text-anchor="middle" class="box-title" fill="#c13a26">Moshi</text>

  <text x="440" y="179" text-anchor="middle" class="wait-label">…대기 중…</text>

  <!-- Static speaking-interval bars: no overlap -->
  <rect x="220" y="164" width="190" height="6" rx="3" fill="#a8a29e" />
  <rect x="470" y="214" width="190" height="6" rx="3" fill="#e34a33" />

  <g class="g-user-half">
    <text x="220" y="154" class="stream-text" fill="#292524" clip-path="url(#clipUserHalf)">오늘 날씨 어때?</text>
  </g>
  <g class="g-moshi-half">
    <text x="565" y="204" class="stream-text" fill="#c13a26" clip-path="url(#clipMoshiHalf)">맑고 따뜻해요</text>
  </g>

  <line x1="60" y1="252" x2="820" y2="252" stroke="#e7dfd3" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Panel B: Full-duplex -->
  <rect x="300" y="270" width="280" height="26" rx="13" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="440" y="288" text-anchor="middle" class="panel-label" fill="#059669">Full-duplex: 들으면서 겹쳐 반응한다</text>

  <rect x="40" y="316" width="170" height="120" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <use href="#icon-person" transform="translate(125,358)" />
  <text x="125" y="411" text-anchor="middle" class="box-title" fill="#292524">사용자</text>

  <rect x="670" y="316" width="170" height="120" rx="16" fill="#ffe4de" stroke="#ffab91" stroke-width="2" />
  <use href="#icon-ai" transform="translate(755,358)" />
  <text x="755" y="411" text-anchor="middle" class="box-title" fill="#c13a26">Moshi</text>

  <!-- Static speaking-interval bars: overlapping -->
  <rect x="370" y="364" width="120" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-dasharray="3 3" />
  <text x="430" y="395" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">겹침</text>
  <rect x="220" y="370" width="270" height="6" rx="3" fill="#a8a29e" />
  <rect x="370" y="420" width="290" height="6" rx="3" fill="#e34a33" />

  <g class="g-user-full">
    <text x="220" y="360" class="stream-text" fill="#292524" clip-path="url(#clipUserFull)">오늘 날씨…</text>
  </g>
  <g class="g-moshi-full">
    <text x="545" y="410" class="stream-text" fill="#c13a26" clip-path="url(#clipMoshiFull)">네, 확인해볼게요</text>
  </g>

  <text x="440" y="470" text-anchor="middle" class="caption-text">Full-duplex에서는 사용자의 말이 끝나기 전에 Moshi가 반응을 시작해, 두 구간이 겹친다.</text>
</svg>
