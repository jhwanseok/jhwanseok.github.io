<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" aria-labelledby="bpoTitle bpoDesc">
  <title id="bpoTitle">한 번 흔들면 방향 하나만 알 수 있다</title>
  <desc id="bpoDesc">위쪽은 측정 한 번의 순서입니다. 층 출력에 작은 잡음을 더하고, forward를 다시 돌려 손실 변화를 재고, 잡음 방향과 손실 변화를 곱해 그 방향에 대한 정보 하나를 얻습니다. 아래쪽 세 칸은 이 측정을 1번, 16번, 수천 번 평균했을 때 추정한 방향이 알고 싶은 답에 점점 가까워지는 모습입니다.</desc>

  <defs>
    <marker id="bpoArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
    <marker id="bpoArrowCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e34a33" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
    .title-text { font-weight: 700; font-size: 22px; fill: #292524; }
    .subtitle-text { font-size: 14px; fill: #8a7f72; }
    .panel-label { font-weight: 700; font-size: 14px; }
    .box-title { font-weight: 700; font-size: 14px; }
    .box-sub { font-size: 12px; fill: #8a7f72; }
    .arrow-label { font-size: 13px; fill: #8a7f72; }
    .note-text { font-size: 13px; fill: #292524; }
    .caption-text { font-size: 15px; fill: #292524; }
  </style>

  <rect width="880" height="540" fill="#fdf6ec" />

  <text x="440" y="34" text-anchor="middle" class="title-text">한 번 흔들면 방향 하나만 알 수 있다</text>
  <text x="440" y="56" text-anchor="middle" class="subtitle-text">그래서 forward만 쓰는 학습은 방향을 바꿔 가며 여러 번 재고 평균을 낸다</text>

  <!-- one measurement: 5 steps, w140, gap 28, start 34 -->
  <rect x="34" y="84" width="140" height="58" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="104" y="108" text-anchor="middle" class="box-title" fill="#292524">층 출력</text>
  <text x="104" y="127" text-anchor="middle" class="box-sub">지금의 활성값</text>

  <line x1="178" y1="113" x2="198" y2="113" stroke="#b3a08c" stroke-width="2" marker-end="url(#bpoArrow)" />

  <rect x="202" y="84" width="140" height="58" rx="12" fill="#ffe4de" stroke="#ffab91" stroke-width="2" />
  <text x="272" y="108" text-anchor="middle" class="box-title" fill="#c13a26">작은 잡음 더하기</text>
  <text x="272" y="127" text-anchor="middle" class="box-sub">무작위 방향 하나</text>

  <line x1="346" y1="113" x2="366" y2="113" stroke="#b3a08c" stroke-width="2" marker-end="url(#bpoArrow)" />

  <rect x="370" y="84" width="140" height="58" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="440" y="108" text-anchor="middle" class="box-title" fill="#292524">forward 다시</text>
  <text x="440" y="127" text-anchor="middle" class="box-sub">위층은 그대로 계산</text>

  <line x1="514" y1="113" x2="534" y2="113" stroke="#b3a08c" stroke-width="2" marker-end="url(#bpoArrow)" />

  <rect x="538" y="84" width="140" height="58" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" />
  <text x="608" y="108" text-anchor="middle" class="box-title" fill="#059669">손실 변화 재기</text>
  <text x="608" y="127" text-anchor="middle" class="box-sub">늘었나, 줄었나</text>

  <line x1="682" y1="113" x2="702" y2="113" stroke="#b3a08c" stroke-width="2" marker-end="url(#bpoArrow)" />

  <rect x="706" y="84" width="140" height="58" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="776" y="108" text-anchor="middle" class="box-title" fill="#292524">방향 × 변화</text>
  <text x="776" y="127" text-anchor="middle" class="box-sub">그 방향의 정보 하나</text>

  <text x="440" y="170" text-anchor="middle" class="arrow-label">이 다섯 단계가 측정 한 번입니다. 아래는 이 측정을 몇 번 평균했느냐의 차이입니다.</text>

  <!-- three panels: x 30 / 310 / 590, w 260, y 190..450 -->
  <!-- panel 1 -->
  <rect x="30" y="190" width="260" height="260" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <rect x="100" y="202" width="120" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" />
  <text x="160" y="219" text-anchor="middle" class="panel-label" fill="#92400e">1번 흔들기</text>
  <circle cx="160" cy="370" r="100" fill="none" stroke="#e7dfd3" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="160" y1="370" x2="250" y2="310" stroke="#b3a08c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#bpoArrow)" />
  <line x1="160" y1="370" x2="170" y2="275" stroke="#e34a33" stroke-width="3" marker-end="url(#bpoArrowCoral)" />
  <circle cx="160" cy="370" r="4" fill="#292524" />
  <text x="160" y="436" text-anchor="middle" class="note-text">추정이 거칠다</text>

  <!-- panel 2 -->
  <rect x="310" y="190" width="260" height="260" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <rect x="380" y="202" width="120" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" />
  <text x="440" y="219" text-anchor="middle" class="panel-label" fill="#92400e">16번 평균</text>
  <circle cx="440" cy="370" r="100" fill="none" stroke="#e7dfd3" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="440" y1="370" x2="530" y2="310" stroke="#b3a08c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#bpoArrow)" />
  <line x1="440" y1="370" x2="510" y2="290" stroke="#e34a33" stroke-width="3" marker-end="url(#bpoArrowCoral)" />
  <circle cx="440" cy="370" r="4" fill="#292524" />
  <text x="440" y="436" text-anchor="middle" class="note-text">가까워진다</text>

  <!-- panel 3 -->
  <rect x="590" y="190" width="260" height="260" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <rect x="660" y="202" width="120" height="24" rx="12" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="720" y="219" text-anchor="middle" class="panel-label" fill="#059669">수천 번 평균</text>
  <circle cx="720" cy="370" r="100" fill="none" stroke="#e7dfd3" stroke-width="1" stroke-dasharray="3 4" />
  <line x1="720" y1="370" x2="810" y2="310" stroke="#b3a08c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#bpoArrow)" />
  <line x1="720" y1="370" x2="806" y2="306" stroke="#e34a33" stroke-width="3" marker-end="url(#bpoArrowCoral)" />
  <circle cx="720" cy="370" r="4" fill="#292524" />
  <text x="720" y="436" text-anchor="middle" class="note-text">거의 같아진다</text>

  <!-- legend -->
  <line x1="190" y1="478" x2="226" y2="478" stroke="#b3a08c" stroke-width="2.5" stroke-dasharray="6 4" />
  <text x="234" y="483" text-anchor="start" class="arrow-label">알고 싶은 답 (역전파가 주는 기울기)</text>
  <line x1="500" y1="478" x2="536" y2="478" stroke="#e34a33" stroke-width="3" />
  <text x="544" y="483" text-anchor="start" class="arrow-label">측정으로 얻은 추정</text>

  <text x="440" y="522" text-anchor="middle" class="caption-text">정확한 답에 가까워질수록 forward가 늘어납니다. 이 비용을 줄이는 것이 대회의 과제입니다.</text>
</svg>
