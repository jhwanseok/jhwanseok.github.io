<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title">열두 편은 앞 편이 남긴 질문을 이어받으며 쌓였다</title>
  <desc id="desc">시리즈 2편부터 12편까지를 5막으로 나눠 보여 준다. 각 카드는 앞 편이 남긴 질문에 답한다. 1막 이산화: 2편 HuBERT 외(토큰에 무엇을 담을까). 2막 생성: 3편 AudioLM(코드북은 무엇이 예측하나), 4편 VALL-E(무슨 말을 할지 정할 수 없다). 3막 텍스트 지능: 5편 Spirit LM(목소리만 흉내 내고 의미는 모른다), 6편 GLM-4-Voice 외(텍스트가 끝나야 음성이 시작된다). 4막 실시간 대화: 7편 Moshi(내 말이 끝나야 상대가 말한다), 8편 Inner Monologue(Depth 맨 앞은 왜 텍스트인가), 9편 Qwen3-Omni(추론과 발화를 두 구조로 나누면), 10편 PersonaPlex(누구의 목소리와 역할을 맡길까). 5막 측정과 서빙: 11편 Full-Duplex-Bench(좋아졌다는 판단을 무엇으로 검증하나), 12편 에필로그(잘 재는 모델은 왜 서비스로 못 가나).</desc>

  <rect x="0" y="0" width="1000" height="540" fill="#fdf6ec" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#292524">열두 편은 앞 편이 남긴 질문을 이어받으며 쌓였다</text>
  <text x="500" y="52" text-anchor="middle" font-size="13.5" fill="#8a7f72">카드의 제목은 답, 그 아래 두 줄은 그 편이 이어받은 질문이다. 위에서 아래로, 왼쪽에서 오른쪽으로 읽는다</text>

  <!-- Act 1 -->
  <rect x="20" y="70" width="172" height="30" rx="15" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="106" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#292524">1막 이산화</text>
  <rect x="20" y="112" width="172" height="84" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <circle cx="40" cy="134" r="12" fill="#292524" />
  <text x="40" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <text x="60" y="139" font-size="13.5" font-weight="700" fill="#292524">HuBERT 외</text>
  <text x="34" y="162" font-size="12" font-weight="500" fill="#8a7f72">토큰에 무엇을</text>
  <text x="34" y="180" font-size="12" font-weight="500" fill="#8a7f72">담을까</text>

  <!-- Act 2 -->
  <rect x="212" y="70" width="172" height="30" rx="15" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
  <text x="298" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">2막 생성</text>
  <rect x="212" y="112" width="172" height="84" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
  <circle cx="232" cy="134" r="12" fill="#92400e" />
  <text x="232" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
  <text x="252" y="139" font-size="13.5" font-weight="700" fill="#92400e">AudioLM</text>
  <text x="226" y="162" font-size="12" font-weight="500" fill="#8a7f72">코드북은 무엇이</text>
  <text x="226" y="180" font-size="12" font-weight="500" fill="#8a7f72">예측하나</text>
  <line x1="298" y1="196" x2="298" y2="210" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="212" y="208" width="172" height="84" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
  <circle cx="232" cy="230" r="12" fill="#92400e" />
  <text x="232" y="235" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
  <text x="252" y="235" font-size="13.5" font-weight="700" fill="#92400e">VALL-E</text>
  <text x="226" y="258" font-size="12" font-weight="500" fill="#8a7f72">무슨 말을 할지</text>
  <text x="226" y="276" font-size="12" font-weight="500" fill="#8a7f72">정할 수 없다</text>

  <!-- Act 3 -->
  <rect x="404" y="70" width="172" height="30" rx="15" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" />
  <text x="490" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#059669">3막 텍스트 지능</text>
  <rect x="404" y="112" width="172" height="84" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" />
  <circle cx="424" cy="134" r="12" fill="#059669" />
  <text x="424" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
  <text x="444" y="139" font-size="13.5" font-weight="700" fill="#059669">Spirit LM</text>
  <text x="418" y="162" font-size="12" font-weight="500" fill="#8a7f72">목소리만 흉내,</text>
  <text x="418" y="180" font-size="12" font-weight="500" fill="#8a7f72">의미는 모른다</text>
  <line x1="490" y1="196" x2="490" y2="210" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="404" y="208" width="172" height="84" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" />
  <circle cx="424" cy="230" r="12" fill="#059669" />
  <text x="424" y="235" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
  <text x="444" y="235" font-size="13.5" font-weight="700" fill="#059669">GLM-4-Voice 외</text>
  <text x="418" y="258" font-size="12" font-weight="500" fill="#8a7f72">텍스트가 끝나야</text>
  <text x="418" y="276" font-size="12" font-weight="500" fill="#8a7f72">음성이 시작된다</text>

  <!-- Act 4 -->
  <rect x="596" y="70" width="172" height="30" rx="15" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <text x="682" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c13a26">4막 실시간 대화</text>
  <rect x="596" y="112" width="172" height="84" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <circle cx="616" cy="134" r="12" fill="#c13a26" />
  <text x="616" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">7</text>
  <text x="636" y="139" font-size="13.5" font-weight="700" fill="#c13a26">Moshi</text>
  <text x="610" y="162" font-size="12" font-weight="500" fill="#8a7f72">내 말이 끝나야</text>
  <text x="610" y="180" font-size="12" font-weight="500" fill="#8a7f72">상대가 말한다</text>
  <line x1="682" y1="196" x2="682" y2="210" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="596" y="208" width="172" height="84" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <circle cx="616" cy="230" r="12" fill="#c13a26" />
  <text x="616" y="235" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">8</text>
  <text x="636" y="235" font-size="13.5" font-weight="700" fill="#c13a26">Inner Monologue</text>
  <text x="610" y="258" font-size="12" font-weight="500" fill="#8a7f72">Depth 맨 앞은</text>
  <text x="610" y="276" font-size="12" font-weight="500" fill="#8a7f72">왜 텍스트인가</text>
  <line x1="682" y1="292" x2="682" y2="306" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="596" y="304" width="172" height="84" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <circle cx="616" cy="326" r="12" fill="#c13a26" />
  <text x="616" y="331" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">9</text>
  <text x="636" y="331" font-size="13.5" font-weight="700" fill="#c13a26">Qwen3-Omni</text>
  <text x="610" y="354" font-size="12" font-weight="500" fill="#8a7f72">추론과 발화를</text>
  <text x="610" y="372" font-size="12" font-weight="500" fill="#8a7f72">두 구조로 나누면</text>
  <line x1="682" y1="388" x2="682" y2="402" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="596" y="400" width="172" height="84" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <circle cx="616" cy="422" r="12" fill="#c13a26" />
  <text x="616" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">10</text>
  <text x="636" y="427" font-size="13.5" font-weight="700" fill="#c13a26">PersonaPlex</text>
  <text x="610" y="450" font-size="12" font-weight="500" fill="#8a7f72">누구의 목소리와</text>
  <text x="610" y="468" font-size="12" font-weight="500" fill="#8a7f72">역할을 맡길까</text>

  <!-- Act 5 -->
  <rect x="788" y="70" width="172" height="30" rx="15" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="874" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#292524">5막 측정과 서빙</text>
  <rect x="788" y="112" width="172" height="84" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <circle cx="808" cy="134" r="12" fill="#292524" />
  <text x="808" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">11</text>
  <text x="828" y="139" font-size="13" font-weight="700" fill="#292524">Full-Duplex-Bench</text>
  <text x="802" y="162" font-size="12" font-weight="500" fill="#8a7f72">좋아졌다는 판단을</text>
  <text x="802" y="180" font-size="12" font-weight="500" fill="#8a7f72">무엇으로 검증하나</text>
  <line x1="874" y1="196" x2="874" y2="210" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="788" y="208" width="172" height="84" rx="14" fill="#e34a33" stroke="#c13a26" stroke-width="1.5" />
  <circle cx="808" cy="230" r="12" fill="#fff8f5" />
  <text x="808" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#c13a26">12</text>
  <text x="828" y="235" font-size="13.5" font-weight="700" fill="#fff8f5">에필로그</text>
  <text x="802" y="258" font-size="12" font-weight="500" fill="#ffd9cf">잘 재는 모델은 왜</text>
  <text x="802" y="276" font-size="12" font-weight="500" fill="#ffd9cf">서비스로 못 가나</text>

  <!-- Callout for episode 12 -->
  <line x1="874" y1="292" x2="874" y2="316" stroke="#ffab91" stroke-width="1.5" />
  <text x="874" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#c13a26">연쇄가 모델 바깥으로</text>
  <text x="874" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#c13a26">나온 첫 번째 칸</text>

  <text x="500" y="520" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">답은 질문을 닫지 못하고 다음 질문을 낳았다</text>
</svg>
