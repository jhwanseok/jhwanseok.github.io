<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="bpfTitle bpfDesc">
  <title id="bpfTitle">같은 질문, 두 가지 답법: 역전파와 forward만으로 하는 신용 할당</title>
  <desc id="bpfDesc">왼쪽의 역전파는 forward 한 번과 backward 한 번으로 모든 층의 오차를 한꺼번에 계산합니다. 오른쪽의 forward만 쓰는 방식은 한 층에 작은 잡음을 더해 forward를 돌리고 손실이 얼마나 변했는지 잰 뒤, 방향을 바꿔 여러 번 반복해서 그 층의 오차를 추정합니다. Noise 챌린지는 왼쪽을 금지하고 오른쪽만 허용합니다.</desc>

  <defs>
    <marker id="bpfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
    .title-text { font-weight: 700; font-size: 22px; fill: #292524; }
    .subtitle-text { font-size: 14px; fill: #8a7f72; }
    .panel-label { font-weight: 700; font-size: 14px; }
    .box-title { font-weight: 700; font-size: 14px; }
    .box-sub { font-size: 12px; fill: #8a7f72; }
    .arrow-label { font-size: 13px; fill: #8a7f72; }
    .note-text { font-size: 13px; fill: #292524; }
    .caption-text { font-size: 15px; fill: #292524; }
  </style>

  <rect width="880" height="500" fill="#fdf6ec" />

  <text x="440" y="34" text-anchor="middle" class="title-text">같은 질문, 두 가지 답법</text>
  <text x="440" y="56" text-anchor="middle" class="subtitle-text">역전파는 한 번에 계산하고, forward만 쓰는 학습은 흔들어 보고 잰다</text>

  <!-- shared question -->
  <rect x="230" y="70" width="420" height="30" rx="15" fill="#ffe4de" stroke="#ffab91" />
  <text x="440" y="90" text-anchor="middle" class="panel-label" fill="#c13a26">질문: 이 층이 손실에 얼마나 책임이 있나?</text>

  <!-- ===== Left panel: backprop ===== -->
  <rect x="30" y="116" width="400" height="330" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <rect x="120" y="128" width="220" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" />
  <text x="230" y="145" text-anchor="middle" class="panel-label" fill="#92400e">역전파: Noise에서는 금지</text>

  <!-- stack, boxes x 140..320 (center 230), h 40 -->
  <rect x="140" y="166" width="180" height="40" rx="10" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="230" y="183" text-anchor="middle" class="box-title" fill="#292524">손실</text>
  <text x="230" y="199" text-anchor="middle" class="box-sub">숫자 하나</text>

  <rect x="140" y="218" width="180" height="40" rx="10" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="230" y="235" text-anchor="middle" class="box-title" fill="#292524">층 3</text>
  <text x="230" y="251" text-anchor="middle" class="box-sub">오차를 계산해 받는다</text>

  <rect x="140" y="270" width="180" height="40" rx="10" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="230" y="287" text-anchor="middle" class="box-title" fill="#292524">층 2</text>
  <text x="230" y="303" text-anchor="middle" class="box-sub">오차를 계산해 받는다</text>

  <rect x="140" y="322" width="180" height="40" rx="10" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="230" y="339" text-anchor="middle" class="box-title" fill="#292524">층 1</text>
  <text x="230" y="355" text-anchor="middle" class="box-sub">오차를 계산해 받는다</text>

  <rect x="140" y="374" width="180" height="32" rx="10" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="230" y="395" text-anchor="middle" class="box-title" fill="#292524">입력 토큰</text>

  <!-- forward arrow (up), left side -->
  <line x1="110" y1="402" x2="110" y2="172" stroke="#b3a08c" stroke-width="2" marker-end="url(#bpfArrow)" />
  <text x="78" y="290" text-anchor="middle" class="arrow-label">forward</text>
  <text x="78" y="307" text-anchor="middle" class="arrow-label">1번</text>

  <!-- backward arrow (down), right side, dashed -->
  <line x1="350" y1="172" x2="350" y2="356" stroke="#b3a08c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#bpfArrow)" />
  <text x="388" y="257" text-anchor="middle" class="arrow-label">backward</text>
  <text x="388" y="274" text-anchor="middle" class="arrow-label">1번</text>

  <text x="230" y="432" text-anchor="middle" class="note-text">chain rule로 모든 층의 오차를 한 번에</text>

  <!-- ===== Right panel: forward only ===== -->
  <rect x="450" y="116" width="400" height="330" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <rect x="540" y="128" width="220" height="24" rx="12" fill="#ffe4de" stroke="#ffab91" />
  <text x="650" y="145" text-anchor="middle" class="panel-label" fill="#c13a26">forward만: Noise의 방식</text>

  <!-- stack, boxes x 560..740 (center 650) -->
  <rect x="560" y="166" width="180" height="40" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" />
  <text x="650" y="183" text-anchor="middle" class="box-title" fill="#059669">손실</text>
  <text x="650" y="199" text-anchor="middle" class="box-sub">얼마나 변했는지 잰다</text>

  <rect x="560" y="218" width="180" height="40" rx="10" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="650" y="235" text-anchor="middle" class="box-title" fill="#292524">층 3</text>
  <text x="650" y="251" text-anchor="middle" class="box-sub">그대로 계산</text>

  <rect x="560" y="270" width="180" height="40" rx="10" fill="#e34a33" stroke="#c13a26" stroke-width="2" />
  <text x="650" y="287" text-anchor="middle" class="box-title" fill="#ffffff">층 2</text>
  <text x="650" y="303" text-anchor="middle" font-size="12" fill="#ffffff">출력에 작은 잡음을 더한다</text>

  <rect x="560" y="322" width="180" height="40" rx="10" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="650" y="339" text-anchor="middle" class="box-title" fill="#292524">층 1</text>
  <text x="650" y="355" text-anchor="middle" class="box-sub">그대로 계산</text>

  <rect x="560" y="374" width="180" height="32" rx="10" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="650" y="395" text-anchor="middle" class="box-title" fill="#292524">입력 토큰</text>

  <!-- forward arrow (up), left side -->
  <line x1="530" y1="402" x2="530" y2="172" stroke="#b3a08c" stroke-width="2" marker-end="url(#bpfArrow)" />
  <text x="498" y="290" text-anchor="middle" class="arrow-label">forward</text>
  <text x="498" y="307" text-anchor="middle" class="arrow-label">여러 번</text>

  <!-- repeat loop on the right: loss back to layer 2, not a gradient -->
  <path d="M744,186 C790,186 790,290 748,290" fill="none" stroke="#b3a08c" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#bpfArrow)" />
  <text x="808" y="231" text-anchor="middle" class="arrow-label">방향을</text>
  <text x="808" y="248" text-anchor="middle" class="arrow-label">바꿔</text>
  <text x="808" y="265" text-anchor="middle" class="arrow-label">반복</text>

  <text x="650" y="432" text-anchor="middle" class="note-text">흔든 방향과 손실 변화를 곱해 오차를 추정</text>

  <text x="440" y="480" text-anchor="middle" class="caption-text">질문은 같습니다. 달라지는 것은 답 하나를 얻는 데 드는 forward의 수입니다.</text>
</svg>
