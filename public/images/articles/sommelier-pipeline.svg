<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title">Sommelier 파이프라인 흐름도</title>
  <desc id="desc">raw audio가 오디오 표준화, VAD, 화자 분리, 겹침 분리, 배경음 제거, 앙상블 ASR을 거쳐 Full-Duplex 모델 학습 데이터로 이어지는 7단계 파이프라인</desc>

  <rect x="0" y="0" width="900" height="340" fill="#fdf6ec" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
  </defs>

  <!-- Row 1 -->
  <!-- raw audio pill -->
  <rect x="20" y="30" width="190" height="80" rx="40" fill="#fffaf4" stroke="#c9bfae" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="115" y="76" text-anchor="middle" font-size="16" font-weight="500" fill="#57534e">raw audio</text>

  <!-- 오디오 표준화 -->
  <rect x="240" y="30" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="335" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">오디오 표준화</text>
  <text x="335" y="89" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">16kHz·Mono 정규화</text>

  <!-- VAD -->
  <rect x="460" y="30" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="555" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">VAD</text>
  <text x="555" y="89" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">무음 기준 5분 분할</text>

  <!-- 화자 분리 (pale coral — leads into the highlighted step) -->
  <rect x="680" y="30" width="190" height="80" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <text x="775" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#c13a26">화자 분리</text>
  <text x="775" y="89" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">NVIDIA Sortformer</text>

  <!-- Row 1 arrows -->
  <line x1="210" y1="70" x2="238" y2="70" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="70" x2="458" y2="70" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="650" y1="70" x2="678" y2="70" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Elbow connector: row1 col4 -> row2 col1 -->
  <path d="M 775 110 L 775 150 L 115 150 L 115 188" fill="none" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Row 2 -->
  <!-- 겹침 분리 (hero node — solid coral) -->
  <rect x="20" y="190" width="190" height="80" rx="14" fill="#e34a33" stroke="#c13a26" stroke-width="1.5" />
  <text x="115" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#fff8f5">겹침 분리</text>
  <text x="115" y="249" text-anchor="middle" font-size="13.5" font-weight="500" fill="#ffd9cf">Overlap Separation</text>

  <!-- 배경음 제거 -->
  <rect x="240" y="190" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="335" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">배경음 제거</text>
  <text x="335" y="249" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">PANNs 감지 → Demucs</text>

  <!-- 앙상블 ASR (amber — processing-heavy step) -->
  <rect x="460" y="190" width="190" height="80" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
  <text x="555" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">앙상블 ASR</text>
  <text x="555" y="249" text-anchor="middle" font-size="13.5" font-weight="500" fill="#8a7f72">ROVER 다수결 투표</text>

  <!-- Full-Duplex 모델 학습 (destination — solid emerald, positive outcome) -->
  <rect x="680" y="190" width="190" height="80" rx="14" fill="#10b981" stroke="#059669" stroke-width="1.5" />
  <text x="775" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Full-Duplex 모델</text>
  <text x="775" y="249" text-anchor="middle" font-size="13.5" font-weight="500" fill="#ecfdf5">학습 데이터로 사용</text>

  <!-- Row 2 arrows -->
  <line x1="210" y1="230" x2="238" y2="230" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="230" x2="458" y2="230" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="650" y1="230" x2="678" y2="230" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Caption for overlap separation -->
  <line x1="115" y1="270" x2="115" y2="292" stroke="#ffab91" stroke-width="1.5" />
  <text x="20" y="310" text-anchor="start" font-size="13.5" font-weight="500" fill="#c13a26">겹친 구간을 지우지 않고 화자별로 분리·보존</text>

  <text x="450" y="332" text-anchor="middle" font-size="12" fill="#a89f92">Sommelier: Scalable Open Multi-turn Audio Pre-processing (Jung et al., 2026) 재구성</text>
</svg>
