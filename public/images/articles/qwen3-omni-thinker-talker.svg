<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="title">Qwen3-Omni Thinker-Talker 구조도</title>
  <desc id="desc">텍스트·이미지·오디오·비디오 입력이 인코더를 거쳐 Thinker로 모인다. Thinker의 텍스트 출력은 토큰으로 Talker에 전달되고, 그 사이에 외부 모듈(RAG·함수 호출·안전 필터)이 선택적으로 개입할 수 있다. 오디오·비전 멀티모달 특징은 연속 표현으로 Talker에 전달되며, Talker는 코드북 0 예측과 MTP 모듈의 잔여 코드북 예측을 거쳐 코덱 디코더로 실시간 파형을 만든다</desc>

  <rect x="0" y="0" width="900" height="340" fill="#fdf6ec" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c13a26" />
    </marker>
  </defs>

  <!-- Row 1 -->
  <!-- 입력 (dashed pill, external input) -->
  <rect x="20" y="30" width="190" height="80" rx="40" fill="#fffaf4" stroke="#c9bfae" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="115" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#57534e">입력</text>
  <text x="115" y="87" text-anchor="middle" font-size="13" font-weight="500" fill="#8a7f72">텍스트·이미지·오디오·비디오</text>

  <!-- 인코더 -->
  <rect x="240" y="30" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="335" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">인코더</text>
  <text x="335" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#8a7f72">AuT 0.6B + SigLIP2 0.5B</text>

  <!-- Thinker -->
  <rect x="460" y="30" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="555" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">Thinker</text>
  <text x="555" y="89" text-anchor="middle" font-size="11.5" font-weight="500" fill="#8a7f72">MoE 30B-A3B · 인식+텍스트생성</text>

  <!-- 외부 모듈 (amber, caution/optional) -->
  <rect x="680" y="30" width="190" height="80" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="775" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">외부 모듈 (선택)</text>
  <text x="775" y="81" text-anchor="middle" font-size="12.5" font-weight="500" fill="#92400e">RAG·함수 호출·안전 필터</text>
  <text x="775" y="98" text-anchor="middle" font-size="11.5" font-weight="500" fill="#a3702f">텍스트 출력을 다듬어 넘긴다</text>

  <!-- Row 1 arrows -->
  <line x1="210" y1="70" x2="238" y2="70" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="70" x2="458" y2="70" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="650" y1="70" x2="678" y2="70" stroke="#b3a08c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="664" y="58" text-anchor="middle" font-size="11" font-weight="500" fill="#a3702f">선택적 개입</text>

  <!-- Multimodal feature path: Thinker -> Talker (continuous) -->
  <path d="M 520 110 L 520 135 L 70 135 L 70 188" fill="none" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="300" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#57534e">오디오·비전 멀티모달 특징 (연속 표현)</text>

  <!-- Text token path: Thinker -> Talker (discrete), external modules may join -->
  <path d="M 600 110 L 600 160 L 160 160 L 160 188" fill="none" stroke="#c13a26" stroke-width="1.8" marker-end="url(#arrow-coral)" />
  <path d="M 775 110 L 775 160 L 604 160" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="380" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c13a26">텍스트 토큰 (Thinker의 텍스트 은닉 표현은 넘기지 않음)</text>

  <!-- Row 2 -->
  <!-- Talker (pale coral, hero) -->
  <rect x="20" y="190" width="190" height="80" rx="14" fill="#ffe4de" stroke="#ffab91" stroke-width="1.5" />
  <text x="115" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#c13a26">Talker</text>
  <text x="115" y="249" text-anchor="middle" font-size="11.5" font-weight="500" fill="#8a7f72">MoE 3B-A0.3B · 스트리밍 음성 토큰</text>

  <!-- 코드북 0 -->
  <rect x="240" y="190" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="335" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">코드북 0 예측</text>
  <text x="335" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#8a7f72">backbone 선형 헤드</text>

  <!-- MTP 모듈 -->
  <rect x="460" y="190" width="190" height="80" rx="14" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="555" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">MTP 모듈</text>
  <text x="555" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#8a7f72">잔여 코드북 예측</text>

  <!-- 코덱 디코더 (destination, emerald) -->
  <rect x="680" y="190" width="190" height="80" rx="14" fill="#10b981" stroke="#059669" stroke-width="1.5" />
  <text x="775" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">코덱 디코더</text>
  <text x="775" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#ecfdf5">좌측 문맥만 → 실시간 파형</text>

  <!-- Row 2 arrows -->
  <line x1="210" y1="230" x2="238" y2="230" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="430" y1="230" x2="458" y2="230" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="650" y1="230" x2="678" y2="230" stroke="#b3a08c" stroke-width="1.5" marker-end="url(#arrow)" />

  <text x="450" y="308" text-anchor="middle" font-size="13.5" font-weight="500" fill="#c13a26">텍스트는 토큰으로 건너가기 때문에, 두 모델 사이에 외부 모듈이 끼어들 자리가 생긴다.</text>
  <text x="450" y="328" text-anchor="middle" font-size="12" fill="#a89f92">Qwen3-Omni Technical Report (Xu et al., 2025) 재구성</text>
</svg>
