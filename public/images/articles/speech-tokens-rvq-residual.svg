<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="rvqResidualTitle">
  <title id="rvqResidualTitle">RVQ가 코드북을 하나씩 더할 때마다, 막대의 코랄 부분(지금까지 담아낸 값)이 늘어나고 빗금 부분(다음 코드북이 처리할 잔차)이 그만큼 줄어드는 과정</title>

  <defs>
    <pattern id="residualHatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fef3c7" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fcd34d" stroke-width="3" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
    .title-text { font-weight: 700; font-size: 20px; fill: #292524; }
    .subtitle-text { font-size: 13px; fill: #8a7f72; }
    .chip-text { font-size: 13px; font-weight: 700; }
    .caption-text { font-size: 13px; fill: #292524; }
    .label-text { font-size: 12px; fill: #8a7f72; }

    .bar-captured { animation: capturedGrow 8s linear infinite; }
    .bar-residual { animation: residualShrink 8s linear infinite; }
    .chip-1 rect { animation: chip1Fill 8s linear infinite; }
    .chip-1 text { animation: chip1Text 8s linear infinite; }
    .chip-2 rect { animation: chip2Fill 8s linear infinite; }
    .chip-2 text { animation: chip2Text 8s linear infinite; }
    .chip-3 rect { animation: chip3Fill 8s linear infinite; }
    .chip-3 text { animation: chip3Text 8s linear infinite; }
    .chip-4 rect { animation: chip4Fill 8s linear infinite; }
    .chip-4 text { animation: chip4Text 8s linear infinite; }

    @keyframes capturedGrow {
      0%   { height: 70px;  y: 220px; }
      22%  { height: 70px;  y: 220px; }
      25%  { height: 95px;  y: 195px; }
      47%  { height: 95px;  y: 195px; }
      50%  { height: 112px; y: 178px; }
      72%  { height: 112px; y: 178px; }
      75%  { height: 122px; y: 168px; }
      97%  { height: 122px; y: 168px; }
      100% { height: 70px;  y: 220px; }
    }
    @keyframes residualShrink {
      0%   { height: 57px; y: 163px; }
      22%  { height: 57px; y: 163px; }
      25%  { height: 32px; y: 163px; }
      47%  { height: 32px; y: 163px; }
      50%  { height: 15px; y: 163px; }
      72%  { height: 15px; y: 163px; }
      75%  { height: 5px;  y: 163px; }
      97%  { height: 5px;  y: 163px; }
      100% { height: 57px; y: 163px; }
    }

    @keyframes chip1Fill {
      0%     { fill: #e34a33; stroke: #c13a26; }
      22%    { fill: #e34a33; stroke: #c13a26; }
      22.1%  { fill: #fffaf4; stroke: #e7dfd3; }
      100%   { fill: #fffaf4; stroke: #e7dfd3; }
    }
    @keyframes chip1Text {
      0%     { fill: #fdf6ec; }
      22%    { fill: #fdf6ec; }
      22.1%  { fill: #292524; }
      100%   { fill: #292524; }
    }
    @keyframes chip2Fill {
      0%     { fill: #fffaf4; stroke: #e7dfd3; }
      24.9%  { fill: #fffaf4; stroke: #e7dfd3; }
      25%    { fill: #e34a33; stroke: #c13a26; }
      47%    { fill: #e34a33; stroke: #c13a26; }
      47.1%  { fill: #fffaf4; stroke: #e7dfd3; }
      100%   { fill: #fffaf4; stroke: #e7dfd3; }
    }
    @keyframes chip2Text {
      0%     { fill: #292524; }
      24.9%  { fill: #292524; }
      25%    { fill: #fdf6ec; }
      47%    { fill: #fdf6ec; }
      47.1%  { fill: #292524; }
      100%   { fill: #292524; }
    }
    @keyframes chip3Fill {
      0%     { fill: #fffaf4; stroke: #e7dfd3; }
      49.9%  { fill: #fffaf4; stroke: #e7dfd3; }
      50%    { fill: #e34a33; stroke: #c13a26; }
      72%    { fill: #e34a33; stroke: #c13a26; }
      72.1%  { fill: #fffaf4; stroke: #e7dfd3; }
      100%   { fill: #fffaf4; stroke: #e7dfd3; }
    }
    @keyframes chip3Text {
      0%     { fill: #292524; }
      49.9%  { fill: #292524; }
      50%    { fill: #fdf6ec; }
      72%    { fill: #fdf6ec; }
      72.1%  { fill: #292524; }
      100%   { fill: #292524; }
    }
    @keyframes chip4Fill {
      0%     { fill: #fffaf4; stroke: #e7dfd3; }
      74.9%  { fill: #fffaf4; stroke: #e7dfd3; }
      75%    { fill: #e34a33; stroke: #c13a26; }
      97%    { fill: #e34a33; stroke: #c13a26; }
      97.1%  { fill: #fffaf4; stroke: #e7dfd3; }
      100%   { fill: #fffaf4; stroke: #e7dfd3; }
    }
    @keyframes chip4Text {
      0%     { fill: #292524; }
      74.9%  { fill: #292524; }
      75%    { fill: #fdf6ec; }
      97%    { fill: #fdf6ec; }
      97.1%  { fill: #292524; }
      100%   { fill: #292524; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar-captured { animation: none; height: 122px; y: 168px; }
      .bar-residual { animation: none; height: 5px; y: 163px; }
      .chip-1 rect { animation: none; fill: #fffaf4; stroke: #e7dfd3; }
      .chip-1 text { animation: none; fill: #292524; }
      .chip-2 rect { animation: none; fill: #fffaf4; stroke: #e7dfd3; }
      .chip-2 text { animation: none; fill: #292524; }
      .chip-3 rect { animation: none; fill: #fffaf4; stroke: #e7dfd3; }
      .chip-3 text { animation: none; fill: #292524; }
      .chip-4 rect { animation: none; fill: #e34a33; stroke: #c13a26; }
      .chip-4 text { animation: none; fill: #fdf6ec; }
    }
  </style>

  <rect width="880" height="340" fill="#fdf6ec" />

  <text x="440" y="28" text-anchor="middle" class="title-text">RVQ: 잔차를 층마다 다시 양자화한다</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle-text">이전 코드북이 놓친 오차(잔차)만 다음 코드북이 넘겨받는다</text>

  <!-- Step chips -->
  <g class="chip-1">
    <rect x="110" y="88" width="150" height="32" rx="8" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
    <text x="185" y="109" text-anchor="middle" class="chip-text">코드북 1</text>
  </g>
  <text x="278" y="109" text-anchor="middle" fill="#b3a08c" font-size="18">→</text>
  <g class="chip-2">
    <rect x="295" y="88" width="150" height="32" rx="8" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
    <text x="370" y="109" text-anchor="middle" class="chip-text">코드북 2</text>
  </g>
  <text x="463" y="109" text-anchor="middle" fill="#b3a08c" font-size="18">→</text>
  <g class="chip-3">
    <rect x="480" y="88" width="150" height="32" rx="8" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
    <text x="555" y="109" text-anchor="middle" class="chip-text">코드북 3</text>
  </g>
  <text x="648" y="109" text-anchor="middle" fill="#b3a08c" font-size="18">→</text>
  <g class="chip-4">
    <rect x="665" y="88" width="150" height="32" rx="8" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
    <text x="740" y="109" text-anchor="middle" class="chip-text">코드북 4</text>
  </g>

  <!-- Original magnitude frame, split into captured (coral) + residual (hatched) -->
  <text x="440" y="160" text-anchor="middle" class="label-text">원본 값 크기</text>
  <rect x="395" y="163" width="90" height="127" fill="none" stroke="#e7dfd3" stroke-width="1.5" />
  <rect class="bar-residual" x="395" width="90" fill="url(#residualHatch)" stroke="#fcd34d" stroke-width="1.5" />
  <rect class="bar-captured" x="395" width="90" fill="#e34a33" stroke="#c13a26" stroke-width="2" />

  <!-- Legend -->
  <rect x="560" y="200" width="16" height="16" rx="3" fill="#e34a33" stroke="#c13a26" />
  <text x="582" y="213" class="label-text">지금까지 담아낸 값</text>
  <rect x="560" y="224" width="16" height="16" rx="3" fill="url(#residualHatch)" stroke="#fcd34d" />
  <text x="582" y="237" class="label-text">잔차 — 다음 코드북이 처리할 몫</text>

  <text x="440" y="316" text-anchor="middle" class="caption-text">코드북을 하나씩 더할 때마다, 빗금(잔차)이 다음 코드북에 넘어가 코랄로 바뀐다.</text>
</svg>
