<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="bplTitle bplDesc">
  <title id="bplTitle">어디까지 내려왔나: 역전파 기준선과 backward 없는 기록의 검증 손실</title>
  <desc id="bplDesc">왼쪽 열은 1,000만 토큰 시기입니다. 역전파 기준선은 SGD 5.007, Adam 3.769이고, backward 없는 쪽은 EGGROLL 5.954, Dust와 Adam의 출발선 4.167에서 기록 3.676까지 내려와 Adam 역전파 기준선보다 낮아졌습니다. 오른쪽 열은 3,000만 토큰 시기입니다. Dust와 Adam 출발선 3.767에서 기록 3.409까지 내려와 Adam 역전파 3.419보다 낮지만, 같은 옵티마이저인 ANVIL II를 쓴 역전파 3.340에는 아직 못 미칩니다. 두 열의 눈금은 서로 다릅니다.</desc>

  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
    .title-text { font-weight: 700; font-size: 22px; fill: #292524; }
    .subtitle-text { font-size: 14px; fill: #8a7f72; }
    .panel-label { font-weight: 700; font-size: 14px; }
    .side-label { font-size: 12px; font-weight: 700; fill: #8a7f72; }
    .pt { font-size: 13px; fill: #292524; }
    .pt-hero { font-size: 13px; font-weight: 700; fill: #c13a26; }
    .pt-amber { font-size: 13px; font-weight: 700; fill: #92400e; }
    .tick { font-size: 11px; fill: #8a7f72; }
    .caption-text { font-size: 15px; fill: #292524; }
  </style>

  <rect width="880" height="560" fill="#fdf6ec" />

  <text x="440" y="34" text-anchor="middle" class="title-text">어디까지 내려왔나: 검증 손실의 사다리</text>
  <text x="440" y="56" text-anchor="middle" class="subtitle-text">아래로 갈수록 좋다. 같은 모델, 같은 데이터, 1에폭. 두 열의 눈금은 서로 다르다</text>

  <!-- ===== 10M column: axis x=250, y=120 (6.0) .. 440 (3.6) ===== -->
  <rect x="30" y="72" width="400" height="404" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="230" y="96" text-anchor="middle" class="panel-label" fill="#292524">1,000만 토큰 (10월 22일까지)</text>
  <text x="140" y="116" text-anchor="middle" class="side-label">역전파</text>
  <text x="330" y="116" text-anchor="middle" class="side-label">backward 없이</text>

  <line x1="250" y1="124" x2="250" y2="444" stroke="#b3a08c" stroke-width="2" />
  <text x="258" y="460" class="tick">3.6</text>

  <!-- Adam backprop line across column -->
  <line x1="50" y1="417.5" x2="410" y2="417.5" stroke="#b3a08c" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- backprop (left) -->
  <circle cx="242" cy="252.4" r="6" fill="#8a7f72" />
  <text x="230" y="257" text-anchor="end" class="pt">SGD 5.007</text>
  <circle cx="242" cy="417.5" r="6" fill="#8a7f72" />
  <text x="230" y="410" text-anchor="end" class="pt">Adam 3.769</text>

  <!-- no-backprop (right) -->
  <circle cx="258" cy="126.1" r="6" fill="#fffaf4" stroke="#8a7f72" stroke-width="2" />
  <text x="272" y="131" text-anchor="start" class="pt">EGGROLL 5.954</text>
  <circle cx="258" cy="364.4" r="6" fill="#fffaf4" stroke="#8a7f72" stroke-width="2" />
  <text x="272" y="369" text-anchor="start" class="pt">Dust + Adam 4.167 출발선</text>
  <circle cx="258" cy="429.9" r="7" fill="#e34a33" stroke="#c13a26" stroke-width="1.5" />
  <text x="272" y="437" text-anchor="start" class="pt-hero">기록 3.676</text>

  <!-- ===== 30M column: axis x=670, y=120 (3.80) .. 440 (3.30) ===== -->
  <rect x="450" y="72" width="400" height="404" rx="16" fill="#fffaf4" stroke="#e7dfd3" stroke-width="1.5" />
  <text x="650" y="96" text-anchor="middle" class="panel-label" fill="#292524">3,000만 토큰 (10월 22일부터)</text>
  <text x="560" y="116" text-anchor="middle" class="side-label">역전파</text>
  <text x="750" y="116" text-anchor="middle" class="side-label">backward 없이</text>

  <line x1="670" y1="124" x2="670" y2="444" stroke="#b3a08c" stroke-width="2" />
  <text x="678" y="460" class="tick">3.3</text>

  <line x1="470" y1="363.8" x2="830" y2="363.8" stroke="#b3a08c" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- backprop (left) -->
  <circle cx="662" cy="363.8" r="6" fill="#8a7f72" />
  <text x="650" y="359" text-anchor="end" class="pt">Adam 3.419</text>
  <circle cx="662" cy="414.4" r="7" fill="#fbbf24" stroke="#92400e" stroke-width="1.5" />
  <text x="650" y="419" text-anchor="end" class="pt-amber">ANVIL II 3.340</text>

  <!-- no-backprop (right) -->
  <circle cx="678" cy="141.1" r="6" fill="#fffaf4" stroke="#8a7f72" stroke-width="2" />
  <text x="692" y="146" text-anchor="start" class="pt">Dust + Adam 3.767 출발선</text>
  <circle cx="678" cy="370.2" r="7" fill="#e34a33" stroke="#c13a26" stroke-width="1.5" />
  <text x="692" y="385" text-anchor="start" class="pt-hero">기록 3.409</text>
  <text x="692" y="401" text-anchor="start" class="tick">10월 25일 현재</text>

  <!-- takeaway pills -->
  <rect x="80" y="490" width="300" height="26" rx="13" fill="#ffe4de" stroke="#ffab91" />
  <text x="230" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#c13a26">Adam 역전파 기준선(점선)보다 낮아졌다</text>
  <rect x="490" y="490" width="320" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d" />
  <text x="650" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">같은 옵티마이저의 역전파는 아직 앞선다</text>

  <text x="440" y="546" text-anchor="middle" class="caption-text">그래서 "역전파를 이겼다"보다 "Adam 역전파 기준선보다 낮아졌다"가 정확합니다.</text>
</svg>
