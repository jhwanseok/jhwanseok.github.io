<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="prologueCascadeTitle">
  <title id="prologueCascadeTitle">Cascade(ASR→LLM→TTS) 파이프라인은 세 단계를 거치며 오류·지연·paralinguistic 정보 손실이 누적되지만, End-to-end(Tokenizer→Language Model→Vocoder) 파이프라인은 음성을 하나의 통합 경로로 처리해 정보를 보존하고 지연을 줄인다.</title>

  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3a08c" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
    .title-text { font-weight: 700; font-size: 22px; fill: #292524; }
    .subtitle-text { font-size: 14px; fill: #8a7f72; }
    .panel-label { font-weight: 700; font-size: 14px; }
    .box-title { font-weight: 700; font-size: 16px; }
    .box-title-sm { font-weight: 700; font-size: 14px; }
    .arrow-label { font-size: 13px; fill: #8a7f72; }
    .tag-text { font-size: 13px; }
    .caption-text { font-size: 15px; fill: #292524; }
  </style>

  <rect width="880" height="440" fill="#fdf6ec" />

  <text x="440" y="32" text-anchor="middle" class="title-text">같은 목적지, 다른 경로</text>
  <text x="440" y="54" text-anchor="middle" class="subtitle-text">무엇을 거치느냐가 무엇을 남기고 무엇을 잃는지를 정한다</text>

  <!-- Cascade panel -->
  <rect x="300" y="70" width="280" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d" />
  <text x="440" y="88" text-anchor="middle" class="panel-label" fill="#92400e">Cascade — 세 단계를 거치며 잃는다</text>

  <!-- row: y 112-178, center 145. box centers: 106 / 273 / 440 / 607 / 774 -->
  <rect x="50" y="112" width="112" height="66" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="106" y="150" text-anchor="middle" class="box-title-sm" fill="#292524">사용자 음성</text>

  <line x1="166" y1="145" x2="213" y2="145" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrowP)" />

  <rect x="217" y="112" width="112" height="66" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="2" />
  <text x="273" y="150" text-anchor="middle" class="box-title" fill="#92400e">ASR</text>

  <line x1="333" y1="145" x2="380" y2="145" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrowP)" />
  <text x="357" y="130" text-anchor="middle" class="arrow-label">텍스트</text>

  <rect x="384" y="112" width="112" height="66" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="2" />
  <text x="440" y="150" text-anchor="middle" class="box-title" fill="#92400e">LLM</text>

  <line x1="500" y1="145" x2="547" y2="145" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrowP)" />
  <text x="524" y="130" text-anchor="middle" class="arrow-label">텍스트</text>

  <rect x="551" y="112" width="112" height="66" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="2" />
  <text x="607" y="150" text-anchor="middle" class="box-title" fill="#92400e">TTS</text>

  <line x1="667" y1="145" x2="714" y2="145" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrowP)" />

  <rect x="718" y="112" width="112" height="66" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="774" y="150" text-anchor="middle" class="box-title-sm" fill="#292524">음성 출력</text>

  <!-- Accumulating losses, centered under their box -->
  <rect x="208" y="196" width="130" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2" />
  <text x="273" y="212" text-anchor="middle" class="tag-text" fill="#92400e">오류 발생 가능</text>

  <rect x="385" y="196" width="110" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2" />
  <text x="440" y="212" text-anchor="middle" class="tag-text" fill="#92400e">+ 지연 누적</text>

  <rect x="527" y="196" width="160" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2" />
  <text x="607" y="212" text-anchor="middle" class="tag-text" fill="#92400e">+ 감정·억양 소실</text>

  <!-- End-to-end panel -->
  <rect x="300" y="252" width="280" height="26" rx="13" fill="#ecfdf5" stroke="#6ee7b7" />
  <text x="440" y="270" text-anchor="middle" class="panel-label" fill="#059669">End-to-end — 하나의 파이프라인으로</text>

  <!-- row: y 292-358, center 325 -->
  <rect x="50" y="292" width="112" height="66" rx="12" fill="#fffaf4" stroke="#e7dfd3" stroke-width="2" />
  <text x="106" y="330" text-anchor="middle" class="box-title-sm" fill="#292524">사용자 음성</text>

  <line x1="166" y1="325" x2="213" y2="325" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrowP)" />

  <rect x="217" y="292" width="112" height="66" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" />
  <text x="273" y="317" text-anchor="middle" class="box-title-sm" fill="#059669">Speech</text>
  <text x="273" y="335" text-anchor="middle" class="box-title-sm" fill="#059669">Tokenizer</text>

  <line x1="333" y1="325" x2="380" y2="325" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrowP)" />
  <text x="357" y="310" text-anchor="middle" class="arrow-label">토큰</text>

  <rect x="384" y="292" width="112" height="66" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" />
  <text x="440" y="317" text-anchor="middle" class="box-title-sm" fill="#059669">Language</text>
  <text x="440" y="335" text-anchor="middle" class="box-title-sm" fill="#059669">Model</text>

  <line x1="500" y1="325" x2="547" y2="325" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrowP)" />
  <text x="524" y="310" text-anchor="middle" class="arrow-label">토큰</text>

  <rect x="551" y="292" width="112" height="66" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" />
  <text x="607" y="330" text-anchor="middle" class="box-title" fill="#059669">Vocoder</text>

  <line x1="667" y1="325" x2="714" y2="325" stroke="#b3a08c" stroke-width="2" marker-end="url(#arrowP)" />

  <rect x="718" y="292" width="112" height="66" rx="12" fill="#10b981" stroke="#059669" stroke-width="2" />
  <text x="774" y="330" text-anchor="middle" class="box-title-sm" fill="#fffaf4">음성 출력</text>

  <rect x="290" y="372" width="300" height="24" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2" />
  <text x="440" y="388" text-anchor="middle" class="tag-text" fill="#059669">정보 보존 + 지연 단축</text>

  <text x="440" y="422" text-anchor="middle" class="caption-text">Cascade는 텍스트를 세 번 거치며 잃고, End-to-end는 음성 토큰 하나로 곧장 간다.</text>
</svg>
